<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Glass Cube – Three.js beginner project</title>
  <meta name="description" content="Interactive glass cube with textures, backgrounds and ripple. Built with Three.js, Vite and deployed on Vercel." />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://gen-motion.vercel.app/" />
  <meta property="og:title" content="Glass Cube – Three.js beginner project" />
  <meta property="og:description" content="Interactive glass cube with textures, backgrounds and ripple. Built with Three.js." />
  <meta property="og:image" content="https://gen-motion.vercel.app/og-image.png" />

  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Glass Cube – Three.js beginner project" />
  <meta name="twitter:description" content="Interactive glass cube with textures, backgrounds and ripple." />
  <meta name="twitter:image" content="https://gen-motion.vercel.app/og-image.png" />

  <style>
    /* your existing styles */
  </style>
</head>

<audio id="bgMusic" loop></audio>

<body>
  <div id="ui">
  <!-- Textures -->
  <button class="btn" data-type="tex" data-file="/tex1.png">1</button>
  <button class="btn" data-type="tex" data-file="/tex2.png">2</button>
  <button class="btn" data-type="tex" data-file="/tex3.png">3</button>

  <!-- Backgrounds -->
  <button class="btn" data-type="bg" data-file="/bg1.gif">A</button>
  <button class="btn" data-type="bg" data-file="/bg2.gif">B</button>
  <button class="btn" data-type="bg" data-file="/bg3.gif">C</button>

  <!-- Audio tracks -->
  <button class="btn" data-type="audio" data-file="/track1.mp3">♪1</button>
  <button class="btn" data-type="audio" data-file="/track2.mp3">♪2</button>
  <button class="btn" data-type="audio" data-file="/track3.mp3">♪3</button>

  <!-- Ripple last -->
  <button class="btn" id="rippleBtn">~</button>
</div>


  <script type="module" src="/src/main.js"></script>
</body>
</html>
